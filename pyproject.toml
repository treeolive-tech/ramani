# ramani: pyproject.toml
[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "ramani"
version = "0.1.0a7"
description = "Ramani (Swahili for “map”): keeps each file's path as a comment on its first line, updates it when files move, and prints your project as a tree."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Wasike Wakhisi", email = "kevin@treeolive.tech" }]
maintainers = [
    { name = "Kevin Wasike Wakhisi", email = "kevin@treeolive.tech" },
]
requires-python = ">=3.13"
keywords = ["comments", "paths", "tree", "project-structure", "cli", "swahili"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = ["pyperclip>=1.11.0", "termcolor>=3.3.0"]

[project.scripts]
ramani = "ramani:main"

[project.urls]
Repository = "https://github.com/treeolive-tech/ramani.git"

[dependency-groups]
dev = ["pytest>=9.2.0", "poethepoet>=0.49.0"]

[tool.uv]
preview-features = ["format-command", "check-command"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.poe.tasks.format]
sequence = [{ cmd = "uv run ramani" }, { cmd = "uv format" }]

[tool.poe.tasks.lint]
sequence = [
    { cmd = "uv lock --check" },
    { cmd = "uv run ramani --check" },
    { cmd = "uv format --check" },
    { cmd = "uv check" },
]

[tool.poe.tasks.test]
sequence = [{ cmd = "uv run pytest" }]

[tool.poe.tasks.add]
sequence = [{ ref = "lint" }, { ref = "test" }, { cmd = "git add ." }]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ramani]
ignore-ext = [".css", "html"]